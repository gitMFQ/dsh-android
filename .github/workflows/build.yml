name: Build

# Produces an installable debug APK for every push to main and for pull requests,
# so a build can be had without the local toolchain at all.
#
# The checkout has no Gradle wrapper and `build.sh` requires JDK 17 and Gradle 8.7
# to already exist under `.toolchain/`, so this job reproduces that layout with
# the runner's own tooling before calling the same entry point a developer uses.
# Nothing here is a separate build definition: if `build.sh` works locally, this
# works, and a change that breaks one breaks both.

on:
  push:
    branches: [main, master]
    paths-ignore:
      # Documentation alone cannot change the APK.
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One build per ref: a newer push supersedes an in-flight one.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # The version the JDK/Gradle pair is pinned to, for both the setup actions
      # and the `.toolchain/` layout below. Kept here rather than in three places
      # so bumping a tool is one edit.
      - name: Toolchain versions
        id: toolchain
        run: |
          # 21, not 17, and for the same reason verify.yml / screenshots.yml were
          # raised: miuix 0.9.4 ships Java 21 bytecode (class file 65). This job ran
          # 17 until 2.4 moved the palette adapter into :design, which put miuix on
          # *that* module's test classpath — the build then died with
          # NoClassDefFoundError inside :design:testDebugUnitTest, 25 tests all
          # failing at once. D8 never had a problem; only the JVM loading the test
          # classes does, and it is the same fix.
          echo "jdk=21" >> "$GITHUB_OUTPUT"
          echo "gradle=9.5.0" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.jdk }}

      # build.sh execs `.toolchain/gradle-<v>/bin/gradle` and sets JAVA_HOME to
      # `.toolchain/jdk-17.0.20.1+1`, so both paths have to exist. The JDK is
      # symlinked rather than copied: build.sh only needs a valid JAVA_HOME, and
      # a copy would double the job's disk for nothing.
      #
      # The directory *name* still says 17 while the JDK behind it is 21. That is
      # deliberate: the name is the path build.sh hard-codes, and renaming it would
      # mean editing build.sh, verify.yml and screenshots.yml in the same commit as
      # the version bump. The name is a path, not a version claim — see the
      # "Toolchain versions" step above for the version that actually runs.
      - name: Lay out .toolchain for build.sh
        run: |
          set -euo pipefail
          # `.toolchain/` is gitignored, so a fresh clone does not have it and
          # every path below depends on it existing first.
          mkdir -p .toolchain/android-home .toolchain/xdg-data

          jdk_home="${JAVA_HOME:?setup-java should have set JAVA_HOME}"
          ln -s "$jdk_home" .toolchain/jdk-17.0.20.1+1

          version='${{ steps.toolchain.outputs.gradle }}'
          curl -fsSL --retry 3 \
            "https://services.gradle.org/distributions/gradle-${version}-bin.zip" \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d .toolchain
          # Already named gradle-<version>; build.sh looks for gradle-9.5.0.
          test -x ".toolchain/gradle-${version}/bin/gradle"

          test -n "${ANDROID_SDK_ROOT:-}" || { echo "ANDROID_SDK_ROOT is unset"; exit 1; }
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          cat local.properties

      - name: Run the JVM test suite
        # The VT core, the terminal's attachment/sequence gates and the seat
        # resolution are pure Kotlin precisely so they can run here. `assembleDebug`
        # alone would let a regression in any of them land green.
        # `:core:model` is a separate test task since the module was extracted;
        # it is named explicitly because depending on it does not make it run.
        run: bash build.sh :app:testDebugUnitTest :core:model:testDebugUnitTest :core:term:test :core:config:testDebugUnitTest :core:protocol:testDebugUnitTest :design:testDebugUnitTest

      - name: Build
        run: bash build.sh :app:assembleDebug

      # Signed with the committed `app/debug.keystore` (see app/build.gradle.kts), so
      # the signature is identical on every run. That is what makes an in-place
      # upgrade possible: left to itself AGP generated a fresh keystore under
      # `.toolchain/android-home` for each job, and a new key per job meant a new
      # signature per job, which Android refuses to install over the previous one.
      - name: Rename artifact for the release name
        id: apk
        run: |
          set -euo pipefail
          src=app/build/outputs/apk/debug/app-debug.apk
          test -f "$src"
          out="dsh-android-${GITHUB_SHA::7}-debug.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$out" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "### Debug APK"
            echo
            echo "\`${{ steps.apk.outputs.path }}\` (${{ steps.apk.outputs.size }})"
            echo
            echo "Signed with the repository's fixed debug key (\`app/debug.keystore\`),"
            echo "so it installs over an existing debug build (\`uk.xa0.dsh.debug\`)"
            echo "without uninstalling it first."
            echo "Download it from the Artifacts section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
