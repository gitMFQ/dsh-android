name: Verify

# Repository gates that do not need a device and are cheap enough to run on every
# push. Kept separate from build.yml so a red test names the test, not an APK job.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM tests (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # build.sh wants `.toolchain/gradle-<v>/bin/gradle` and a JAVA_HOME at
      # `.toolchain/jdk-17.0.20.1+1`; reproduce both exactly as build.yml does.
      - name: Lay out .toolchain
        run: |
          set -euo pipefail
          mkdir -p .toolchain/android-home .toolchain/xdg-data
          ln -s "$JAVA_HOME" .toolchain/jdk-17.0.20.1+1
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-9.5.0-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d .toolchain
          test -x .toolchain/gradle-9.5.0/bin/gradle
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      # L1 gate: the whole 1116-test suite on Kotlin 2.4.21. This is the step that
      # proves the compiler migration did not break anything, before any of the
      # AGP / Compose / miuix upgrades land on top of it.
      # Four test tasks, every one named. Depending on a module does not run its
      # tests, so `:app:testDebugUnitTest` alone would quietly run only the 517 that
      # still live in :app and report a green check over a 599-test-smaller suite.
      # All four are required; together they are the 1116 this gate quotes.
      # :core:term is a plain JVM module, hence `:test` rather than `testDebugUnitTest`.
      # :core:config is an Android library like :core:model, hence testDebugUnitTest.
      # It currently holds no tests of its own (the certificate and config tests still
      # live in :app, where the code that exercises them does), but naming it here is
      # what makes a test that moves in later actually run instead of silently not.
      - name: Unit tests
        run: bash build.sh :app:testDebugUnitTest :core:model:testDebugUnitTest :core:term:test :core:config:testDebugUnitTest :core:protocol:testDebugUnitTest :design:testDebugUnitTest

      # The visual gate. Phase 2 rewrites the shell, and ChatScreen.kt alone is
      # 3200 lines; this is what turns "the re-skin moved something" from
      # something a person notices on a phone days later into a red check with a
      # diff image attached.
      #
      # `-Pscreenshots` is what admits the screenshot class: the build excludes it
      # from the ordinary test task, so the 1 116 functional tests above are not
      # re-run or double-counted here, and their count stays the evidence quoted
      # in every PR. The build is warm by this point, so the incremental cost is
      # the four captures.
      #
      # It compares strictly. If that ever proves flaky on a runner image change,
      # the fix is a documented threshold in the test, not a deleted gate.
      - name: Screenshot gate
        run: bash build.sh :app:verifyRoborazziDebug -Pscreenshots

      # A failed comparison writes `[name]_compare.png` beside the baseline, which
      # is the only artifact that says *what* moved. Uploaded even on success so a
      # reviewer can see the current render without checking out the branch.
      - name: Upload screenshot comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-comparison
          path: |
            app/build/outputs/roborazzi/**
            app/build/reports/roborazzi/**
          if-no-files-found: ignore

      # Always uploaded (not only on failure): the XML under test-results carries
      # the executed test count, which is the evidence that the Kotlin 2.4.21
      # migration actually ran 1116 tests rather than skipping them.
      #
      # `**/build/...`, not `app/build/...`: since :core:model was extracted its
      # 413 tests live under core/model/build/test-results/, and a glob pinned to
      # app/ would drop them from this count while every check stayed green.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

      # Two numbers, reported separately on purpose.
      #
      # The functional suite is the gate every PR quotes — "tests=1116" — and it
      # must stay exactly 1116, because a number that quietly grew is how a
      # deleted test goes unnoticed. The screenshot captures are a different
      # kind of test (they assert pixels, not behaviour) and live in their own
      # XML files under uk/xa0/dsh/screenshot/, so they are counted apart rather
      # than folded in and silently raising the functional total to 1120.
      #
      # The scan covers every module's test-results (see the note on the artifact
      # step above) and prints a per-module breakdown, because with two modules
      # feeding one number the total alone can no longer show that both halves
      # actually ran.
      - name: Summarize executed tests
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, collections, xml.etree.ElementTree as ET

          # Robolectric writes one XML per test class, named after the class, so
          # the screenshot class is excluded by its own name rather than by
          # where the run happened to put it.
          screenshot = 0
          functional = [0, 0, 0, 0]
          per_module = collections.Counter()
          for f in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              r = ET.parse(f).getroot()
              n = int(r.get('tests', 0))
              if 'screenshot' in os.path.basename(f).lower():
                  screenshot += n
              else:
                  functional[0] += n
                  functional[1] += int(r.get('failures', 0))
                  functional[2] += int(r.get('errors', 0))
                  functional[3] += int(r.get('skipped', 0))
                  # The module is the path segment before `build/`.
                  parts = f.split(os.sep)
                  per_module[parts[parts.index('build') - 1]] += n

          t, fa, er, sk = functional
          print(f"tests={t} failures={fa} errors={er} skipped={sk}")
          print(f"screenshots={screenshot} (baseline captures, compared separately)")
          for module, n in sorted(per_module.items()):
              print(f"  {module}: {n}")
          with open('$GITHUB_STEP_SUMMARY', 'a') as s:
              s.write(f"\n### JVM tests\n\ntests={t} failures={fa} errors={er} skipped={sk}\n")
              s.write(f"\nscreenshots={screenshot} baseline captures compared\n")
              s.write("\n| module | tests |\n|---|---|\n")
              for module, n in sorted(per_module.items()):
                  s.write(f"| `{module}` | {n} |\n")
          PY